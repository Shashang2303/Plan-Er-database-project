# mongod configuration for PlanER (MongoDB 8.2 Community + mongot Community Search).
net:
  port: 27017
  bindIpAll: true          # reachable on the Compose network; host port is bound to 127.0.0.1 only

replication:
  replSetName: rs0         # mongot requires a replica set (it syncs via change streams)

storage:
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5     # Docker Desktop has limited RAM; leave room for mongot and Ollama

setParameter:
  # Tell mongod where mongot listens, for search index management and $search/$vectorSearch.
  searchIndexManagementHostAndPort: mongot:27028
  mongotHost: mongot:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled
